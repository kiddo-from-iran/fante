name: frontend
description: "Fante Quiz Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  animations: ^2.1.1
  flutter_quill: ^11.5.0
  pdfx: ^2.9.2
  printing: ^5.14.2
  share_plus: ^12.0.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  pinput: ^5.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Iranian Sans
      fonts:
        - asset: assets/fonts/Iranian Sans.ttf
